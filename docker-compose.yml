services:
  wklejka:
    build: .
    init: true
    read_only: true
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    pids_limit: 100
    stop_grace_period: 10s
    volumes:
      - wklejka-data:/app/data
    restart: unless-stopped

volumes:
  wklejka-data:
    name: wklejka-data
