name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PORT: 3000
  CI: true
  NODE_ENV: test
  TEST_URLS: |
    /
    /livez
    /readyz
    /api/boards

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run quality checks
        run: npm run check

      - name: Lint Dockerfile
        run: >-
          docker run --rm -i
          hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
          < Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: wklejka:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --exit-code 1 \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --quiet \
            --no-progress \
            --table-mode summary \
            --timeout 5m \
            wklejka:test

      - name: Run container
        run: |
          docker run -d --name app \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --tmpfs /app/data:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700 \
            -p "${{ env.APP_PORT }}:${{ env.APP_PORT }}" \
            wklejka:test

      - name: Wait until all endpoints return 200
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 2 --max-time 10 "$@"; }
          base="http://localhost:${{ env.APP_PORT }}"
          IFS=$'\n' read -r -d '' -a URLS < <(printf '%s\0' "${{ env.TEST_URLS }}")
          echo "Checking ${#URLS[@]} endpoint(s)..."

          wait_for_200() {
            local url="$1"
            echo "→ Waiting for 200 from: $url"
            for _attempt in $(seq 1 30); do
              if curl -fsS --max-time 2 "$url" > /dev/null; then
                echo "✅ 200 from: $url"
                return 0
              fi
              sleep 1
            done
            echo "❌ No 200 response within 30s from: $url"
            return 1
          }

          failures=0
          for raw in "${URLS[@]}"; do
            url="${base}${raw}"
            if ! wait_for_200 "$url"; then
              failures=$((failures+1))
            fi
          done

          if [[ $failures -gt 0 ]]; then
            echo "Container logs:"
            docker logs app || true
            exit 1
          fi
          echo "All endpoints responded with 200"

      - name: Smoke test clip creation
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 2 --max-time 10 "$@"; }
          base="http://localhost:${{ env.APP_PORT }}"

          TEXT_CLIP=$(curl -fsS -X POST "${base}/api/boards/default/clips" \
            -H 'Content-Type: application/json' \
            -d '{"type":"text","content":"ci test"}')
          echo "$TEXT_CLIP" | grep -q '"type":"text"'

          curl -fsS "${base}/api/boards/default/clips" | grep -q '"ci test"'
          TEXT_ID=$(echo "$TEXT_CLIP" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsS -X PUT "${base}/api/boards/default/clips/${TEXT_ID}" \
            -H 'Content-Type: application/json' \
            -d '{"content":"ci edited"}' | grep -q '"updatedAt"'
          curl -fsS "${base}/api/boards/default/clips" | grep -q '"ci edited"'

          # File upload
          curl -fsS -X POST "${base}/api/boards/default/clips" \
            -H 'Content-Type: application/json' \
            -d '{"type":"file","content":"data:text/plain;base64,aGVsbG8=","originalName":"test.txt"}' | grep -q '"type":"file"'

          # HTML uploads must download, not execute inline
          HTML_CLIP=$(curl -fsS -X POST "${base}/api/boards/default/clips" \
            -H 'Content-Type: application/json' \
            -d '{"type":"file","content":"data:text/html;base64,PGgxPmhlbGxvPC9oMT4=","originalName":"test.html"}')
          HTML_NAME=$(echo "$HTML_CLIP" | grep -o '"filename":"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsSI "${base}/api/files/${HTML_NAME}" | grep -qi 'Content-Disposition: attachment'
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${base}/api/files/${HTML_NAME}/preview")
          [ "$HTTP_CODE" = "415" ] || { echo "Expected 415, got $HTTP_CODE"; exit 1; }

          # SVG image clips are rejected
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${base}/api/boards/default/clips" \
            -H 'Content-Type: application/json' \
            -d '{"type":"image","content":"data:image/svg+xml;base64,PHN2Zy8+"}')
          [ "$HTTP_CODE" = "400" ] || { echo "Expected 400, got $HTTP_CODE"; exit 1; }

          # Board with expiration
          curl -fsS -X POST "${base}/api/boards" \
            -H 'Content-Type: application/json' \
            -d '{"name":"temp","expiresIn":3600000}' | grep -q '"expiresAt"'

          echo "Smoke test passed"

      - name: Smoke test board rename, reorder, and lock
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 2 --max-time 10 "$@"; }
          base="http://localhost:${{ env.APP_PORT }}"

          # Create two boards
          BOARD_A=$(curl -fsS -X POST "${base}/api/boards" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Board A"}')
          BOARD_B=$(curl -fsS -X POST "${base}/api/boards" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Board B"}')
          ID_A=$(echo "$BOARD_A" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          ID_B=$(echo "$BOARD_B" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          # Rename board
          curl -fsS -X PUT "${base}/api/boards/${ID_A}" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Renamed A"}' | grep -q '"Renamed A"'

          # Reorder boards
          BOARDS_JSON=$(curl -fsS "${base}/api/boards")
          REORDER_PAYLOAD=$(BOARDS_JSON="$BOARDS_JSON" ID_A="$ID_A" ID_B="$ID_B" python3 - <<'PY'
          import json, os

          boards = json.loads(os.environ["BOARDS_JSON"])
          id_a = os.environ["ID_A"]
          id_b = os.environ["ID_B"]
          rest = [board["id"] for board in boards if board["id"] not in {"default", id_a, id_b}]
          print(json.dumps({"ids": ["default", id_b, id_a, *rest]}, separators=(",", ":")))
          PY
          )
          curl -fsS -X PUT "${base}/api/boards/reorder" \
            -H 'Content-Type: application/json' \
            -d "${REORDER_PAYLOAD}" | grep -q '"ok"'

          # Duplicate ids are rejected
          DUPLICATE_REORDER_PAYLOAD=$(BOARDS_JSON="$BOARDS_JSON" ID_A="$ID_A" python3 - <<'PY'
          import json, os

          boards = json.loads(os.environ["BOARDS_JSON"])
          id_a = os.environ["ID_A"]
          rest = [board["id"] for board in boards if board["id"] not in {"default", id_a}]
          print(json.dumps({"ids": ["default", "default", id_a, *rest[:-1]]}, separators=(",", ":")))
          PY
          )
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "${base}/api/boards/reorder" \
            -H 'Content-Type: application/json' \
            -d "${DUPLICATE_REORDER_PAYLOAD}")
          [ "$HTTP_CODE" = "400" ] || { echo "Expected 400, got $HTTP_CODE"; exit 1; }

          # Add a clip before locking so later operations can verify protection.
          CLIP=$(curl -fsS -X POST "${base}/api/boards/${ID_A}/clips" \
            -H 'Content-Type: application/json' \
            -d '{"type":"text","content":"locked clip"}')
          CLIP_ID=$(echo "$CLIP" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          # Lock board
          curl -fsS -X PUT "${base}/api/boards/${ID_A}" \
            -H 'Content-Type: application/json' \
            -d '{"locked":true}' | grep -q '"locked":true'

          # Delete locked board should fail (403)
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "${base}/api/boards/${ID_A}")
          [ "$HTTP_CODE" = "403" ] || { echo "Expected 403, got $HTTP_CODE"; exit 1; }

          # Adding a new clip and deleting the existing one are both forbidden.
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${base}/api/boards/${ID_A}/clips" \
            -H 'Content-Type: application/json' \
            -d '{"type":"text","content":"must be rejected"}')
          [ "$HTTP_CODE" = "403" ] || { echo "Expected 403, got $HTTP_CODE"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "${base}/api/boards/${ID_A}/clips/${CLIP_ID}")
          [ "$HTTP_CODE" = "403" ] || { echo "Expected 403, got $HTTP_CODE"; exit 1; }

          # Unlock and delete should work
          curl -fsS -X PUT "${base}/api/boards/${ID_A}" \
            -H 'Content-Type: application/json' \
            -d '{"locked":false}' | grep -q '"locked":false'
          curl -fsS -X DELETE "${base}/api/boards/${ID_A}" | grep -q '"ok"'

          echo "Board rename, reorder, and lock tests passed"

      - name: Smoke test link preview validation
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 2 --max-time 10 "$@"; }
          base="http://localhost:${{ env.APP_PORT }}"

          # Invalid URL should return 400
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --get "${base}/api/link-preview" \
            --data-urlencode "url=notaurl")
          [ "$HTTP_CODE" = "400" ] || { echo "Expected 400, got $HTTP_CODE"; exit 1; }

          # Loopback/private targets are blocked
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --get "${base}/api/link-preview" \
            --data-urlencode "url=http://127.0.0.1:${{ env.APP_PORT }}")
          [ "$HTTP_CODE" = "400" ] || { echo "Expected 400, got $HTTP_CODE"; exit 1; }

          echo "Link preview tests passed"

      - name: Smoke test auth rate limit
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 2 --max-time 10 "$@"; }
          base="http://localhost:${{ env.APP_PORT }}"

          docker rm -f app
          docker run -d --name app \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --tmpfs /app/data:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700 \
            -e AUTH_TOKEN=secret \
            -e AUTH_RATE_LIMIT=2 \
            -p "${{ env.APP_PORT }}:${{ env.APP_PORT }}" \
            wklejka:test

          for _attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 "${base}/healthz" > /dev/null; then
              break
            fi
            sleep 1
          done

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${base}/api/boards")
          [ "$HTTP_CODE" = "401" ] || { echo "Expected 401, got $HTTP_CODE"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${base}/api/boards")
          [ "$HTTP_CODE" = "401" ] || { echo "Expected 401, got $HTTP_CODE"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${base}/api/boards")
          [ "$HTTP_CODE" = "429" ] || { echo "Expected 429, got $HTTP_CODE"; exit 1; }

          curl -fsS -H 'Authorization: Bearer secret' "${base}/api/boards" | grep -q 'default'
          echo "Auth rate limit test passed"

      - name: Smoke test proxy auth settings
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 2 --max-time 10 "$@"; }
          base="http://localhost:${{ env.APP_PORT }}"

          docker rm -f app
          docker run -d --name app \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --tmpfs /app/data:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700 \
            -e AUTH_TOKEN=secret \
            -e AUTH_RATE_LIMIT=1 \
            -e AUTH_COOKIE_SECURE=auto \
            -e TRUST_PROXY=1 \
            -p "${{ env.APP_PORT }}:${{ env.APP_PORT }}" \
            wklejka:test

          for _attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 "${base}/healthz" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS -D /tmp/wklejka-headers.txt -o /dev/null \
            -H 'X-Forwarded-Proto: https' \
            "${base}/?token=secret"
          grep -qi 'Set-Cookie: .*; Secure' /tmp/wklejka-headers.txt

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Forwarded-For: 203.0.113.10' \
            "${base}/api/boards")
          [ "$HTTP_CODE" = "401" ] || { echo "Expected 401, got $HTTP_CODE"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Forwarded-For: 203.0.113.10' \
            "${base}/api/boards")
          [ "$HTTP_CODE" = "429" ] || { echo "Expected 429, got $HTTP_CODE"; exit 1; }

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-Forwarded-For: 203.0.113.11' \
            "${base}/api/boards")
          [ "$HTTP_CODE" = "401" ] || { echo "Expected 401, got $HTTP_CODE"; exit 1; }

          echo "Proxy auth settings test passed"

      - name: Show container logs on failure
        if: failure()
        run: docker logs app || true

      - name: Clean up
        if: always()
        run: docker rm -f app || true

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare image tags
        id: image
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          SHA_TAG="sha-${GITHUB_SHA}"

          {
            echo "image=${IMAGE}"
            echo "sha_tag=${SHA_TAG}"
            echo "amd64_tag=${SHA_TAG}-amd64"
            echo "arm64_tag=${SHA_TAG}-arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        id: build_amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.amd64_tag }}
          cache-from: type=gha,scope=publish-amd64
          cache-to: type=gha,mode=max,scope=publish-amd64

      - name: Build and push arm64 image
        id: build_arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.arm64_tag }}
          cache-from: type=gha,scope=publish-arm64
          cache-to: type=gha,mode=max,scope=publish-arm64

      - name: Scan published platform images
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          AMD64_TAG: ${{ steps.image.outputs.amd64_tag }}
          ARM64_TAG: ${{ steps.image.outputs.arm64_tag }}
        run: |
          set -euo pipefail

          scan_image() {
            local platform="$1"
            local reference="$2"

            docker pull --platform "$platform" "$reference"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
              --exit-code 1 \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --quiet \
              --no-progress \
              --table-mode summary \
              --timeout 5m \
              --image-src docker \
              --platform "$platform" \
              "$reference"
          }

          scan_image linux/amd64 "${IMAGE}:${AMD64_TAG}"
          scan_image linux/arm64 "${IMAGE}:${ARM64_TAG}"

      - name: Publish canonical multi-platform tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
